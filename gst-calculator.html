<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>GST Calculator | All in One Place</title><meta name="description" content="Calculate GST-inclusive and GST-exclusive amounts quickly."><link rel="stylesheet" href="site.css"><script>(function(){function init(){const out=document.getElementById('out');document.getElementById('calc').addEventListener('click',()=>{try{const a=+amount.value||0,r=+rate.value||0;const gst=a*r/100;out.textContent=`GST: ₹${gst.toFixed(2)}
CGST: ₹${(gst/2).toFixed(2)}
SGST: ₹${(gst/2).toFixed(2)}
Total: ₹${(a+gst).toFixed(2)}`;}catch(e){out.textContent='Please check your inputs.';}});const r=document.getElementById('reset');if(r)r.addEventListener('click',()=>location.reload());}if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',init);}else{init();}})();</script></head>

<main><div class="wrap">
<h1>GST Calculator</h1><p class="lede">Calculate GST, CGST, SGST and total invoice value.</p><div class="ad-slot" data-ad="top"></div><div class="ad-slot" data-ad="middle"></div>
<div class="tool-panel"><div class="tool-grid-compact"><div class="field"><label for="amount">Amount (₹)</label><input id="amount" type="number" step="0.01" placeholder="1000"></div><div class="field"><label for="rate">GST rate (%)</label><input id="rate" type="number" step="0.01" placeholder="18"></div></div><div class="action-row"><button class="primary-btn" id="calc">Calculate GST</button><button class="secondary-btn" id="reset">Reset</button></div><div class="output-box" id="out">Enter values to calculate.</div></div></div></main><footer class="site-footer"><div class="wrap"><p>All in One Place — useful tools, calculators and resources.</p></div></footer><script src="site.js"></script></body></html>
